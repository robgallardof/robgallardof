<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Roberto Gallardo — Software Architect · Full Stack .NET · AI tooling">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fafbff"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.55" stop-color="#4f46e5"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#4f46e5"/></linearGradient>
    <radialGradient id="orb1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.22"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0ea5e9" stop-opacity="0.18"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="rgba(15,23,42,0.045)"/></pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="24"/></clipPath>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .name { font-size: 64px; font-weight: 800; letter-spacing: -1.5px; }
      .role { font-size: 24px; font-weight: 600; fill: #0f172a; }
      .tag { font-size: 17px; fill: #475569; }
      .pill { font-size: 13.5px; font-weight: 600; fill: #0f172a; }
      .code { font-family: "Cascadia Code", "JetBrains Mono", Consolas, Menlo, monospace; font-size: 14px; fill: rgba(15,23,42,0.08); }
      .float1 { animation: f1 9s ease-in-out infinite; }
      .float2 { animation: f2 11s ease-in-out infinite; }
      @keyframes f1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,18px); } }
      @keyframes f2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px,-14px); } }
      @media (prefers-reduced-motion: reduce) { .float1, .float2 { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle class="float1" cx="200" cy="150" r="230" fill="url(#orb1)"/>
    <circle class="float2" cx="1050" cy="260" r="240" fill="url(#orb2)"/>
    <text x="990" y="44" class="code">record Developer {</text><text x="990" y="64" class="code">  Role = &quot;Architect&quot;;</text><text x="990" y="84" class="code">  DotNet = &quot;2.0 → 11&quot;;</text><text x="990" y="104" class="code">  AI = &quot;agents · MCP&quot;;</text><text x="990" y="124" class="code">}</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="24" fill="none" stroke="rgba(15,23,42,0.12)"/>

  <g transform="translate(96 66)">
    <rect width="168" height="168" rx="42" fill="url(#brand)"/>
    <text x="84" y="108" text-anchor="middle" style="font-size:68px;font-weight:800;fill:#ffffff;letter-spacing:-2px">RG</text>
  </g>

  <text x="370" y="118" class="name" fill="url(#name)">Roberto Gallardo</text>
  <text x="372" y="158" class="role">Software Architect · Full Stack .NET · AI tooling</text>
  <text x="372" y="192" class="tag">From .NET Framework 2.0 to .NET 11 — and AI agents that do real, verifiable work.</text>
  <rect x="372" y="222" rx="14" width="127" height="28" fill="rgba(15,23,42,0.05)" stroke="rgba(15,23,42,0.12)"/><text x="436" y="240.5" text-anchor="middle" class="pill">.NET 2.0 → 11</text><rect x="509.3" y="222" rx="14" width="144" height="28" fill="rgba(15,23,42,0.05)" stroke="rgba(15,23,42,0.12)"/><text x="581" y="240.5" text-anchor="middle" class="pill">AI agents · MCP</text><rect x="662.8" y="222" rx="14" width="103" height="28" fill="rgba(15,23,42,0.05)" stroke="rgba(15,23,42,0.12)"/><text x="714" y="240.5" text-anchor="middle" class="pill">Rust tools</text><rect x="775.8" y="222" rx="14" width="168" height="28" fill="rgba(15,23,42,0.05)" stroke="rgba(15,23,42,0.12)"/><text x="860" y="240.5" text-anchor="middle" class="pill">Clean Architecture</text><rect x="953.5999999999999" y="222" rx="14" width="144" height="28" fill="rgba(15,23,42,0.05)" stroke="rgba(15,23,42,0.12)"/><text x="1025" y="240.5" text-anchor="middle" class="pill">Guadalajara, MX</text>
</svg>
