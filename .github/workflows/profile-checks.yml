name: Profile layout checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/profile_layout.py
      - run: python scripts/check_profile.py
      - name: Reproducible vector assets
        run: git diff --exit-code -- assets/icons assets/widgets/ecosystem-* assets/widgets/workflow-*
      - name: Kit blocks match kit.json
        run: |
          pip install --quiet "git+https://github.com/robgallardof/readme-builder@main"
          python -m readme_builder kit render kit.json --check
